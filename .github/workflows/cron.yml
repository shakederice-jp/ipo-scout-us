name: IPO Scout US Cron Jobs

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  sec-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Run SEC Scan
        run: "curl -fsS -X GET https://ipo-us.finance-tower.com/api/cron/sec-scan -H 'Authorization: Bearer ${{ secrets.CRON_SECRET }}'"
      - name: Run SEC Track
        if: always()
        run: "curl -fsS -X GET https://ipo-us.finance-tower.com/api/cron/sec-track -H 'Authorization: Bearer ${{ secrets.CRON_SECRET }}'"
      - name: Run US Price Track
        if: always()
        run: "curl -fsS -X GET https://ipo-us.finance-tower.com/api/cron/us-price-track -H 'Authorization: Bearer ${{ secrets.CRON_SECRET }}'"